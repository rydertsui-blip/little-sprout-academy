<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4db"/>
      <stop offset="100%" stop-color="#d8f3dc"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f1e3"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7f1e3"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="240" height="160" rx="24" fill="url(#bg)"/>
  <circle cx="42" cy="36" r="16" fill="#ffd166" opacity="0.85"/>
  <circle cx="196" cy="40" r="22" fill="#a8dadc" opacity="0.5"/>
  <!-- Open book base -->
  <path d="M36 118 Q78 106 120 118 Q162 106 204 118 L208 126 Q162 114 120 128 Q78 114 32 126 Z" fill="#4ea865"/>
  <!-- Book left page -->
  <path d="M40 52 Q80 42 120 54 L120 118 Q80 106 40 116 Z" fill="url(#pageLeft)" stroke="#d9cbb3" stroke-width="2"/>
  <!-- Book right page -->
  <path d="M120 54 Q160 42 200 52 L200 116 Q160 106 120 118 Z" fill="url(#pageRight)" stroke="#d9cbb3" stroke-width="2"/>
  <!-- Rainbow & sprout popping out of the book -->
  <path d="M76 84 A44 44 0 0 1 164 84" fill="none" stroke="#ef476f" stroke-width="6" stroke-linecap="round"/>
  <path d="M84 84 A36 36 0 0 1 156 84" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
  <path d="M92 84 A28 28 0 0 1 148 84" fill="none" stroke="#06d6a0" stroke-width="6" stroke-linecap="round"/>
  <!-- Text lines on pages -->
  <line x1="54" y1="70" x2="98" y2="68" stroke="#8d99ae" stroke-width="3" stroke-linecap="round"/>
  <line x1="54" y1="82" x2="90" y2="80" stroke="#ef476f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="54" y1="94" x2="102" y2="92" stroke="#8d99ae" stroke-width="3" stroke-linecap="round"/>
  <line x1="142" y1="68" x2="186" y2="70" stroke="#8d99ae" stroke-width="3" stroke-linecap="round"/>
  <line x1="142" y1="80" x2="180" y2="82" stroke="#118ab2" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="142" y1="92" x2="186" y2="94" stroke="#8d99ae" stroke-width="3" stroke-linecap="round"/>
  <!-- Floating stars -->
  <polygon points="120,20 123,28 131,28 125,33 127,41 120,36 113,41 115,33 109,28 117,28" fill="#ffb703"/>
</svg>
